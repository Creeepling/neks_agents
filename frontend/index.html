<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROITeam — Агент по недвижимости</title>
  <meta name="description" content="Внутренняя панель агента по исследованию и анализу недвижимости." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* -------------------------------------------------------------------------
       DESIGN TOKENS
    -------------------------------------------------------------------------- */
    :root {
      --bg-base:        #0d0f13;
      --bg-surface:     #161b22;
      --bg-elevated:    #1c2230;
      --bg-hover:       #1f2937;
      --border:         #2d3748;
      --border-subtle:  #1e2735;

      --text-primary:   #e2e8f0;
      --text-secondary: #8892a4;
      --text-muted:     #4a5568;
      --text-inverse:   #0d0f13;

      --accent:         #3b82f6;
      --accent-hover:   #2563eb;
      --accent-dim:     rgba(59,130,246,0.12);

      --success:        #10b981;
      --success-dim:    rgba(16,185,129,0.12);
      --warning:        #f59e0b;
      --warning-dim:    rgba(245,158,11,0.12);
      --danger:         #ef4444;
      --danger-dim:     rgba(239,68,68,0.12);

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  16px;
      --radius-xl:  24px;

      --shadow-sm:  0 1px 3px rgba(0,0,0,0.4);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg:  0 16px 48px rgba(0,0,0,0.6);

      --font-sans:  'Inter', system-ui, sans-serif;
      --font-mono:  'JetBrains Mono', monospace;

      --sidebar-w:  240px;
      --topbar-h:   56px;
    }

    /* -------------------------------------------------------------------------
       RESET & BASE
    -------------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea {
      font-family: inherit;
      font-size: 14px;
      outline: none;
      border: none;
    }
    textarea { resize: vertical; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* -------------------------------------------------------------------------
       UTILITIES
    -------------------------------------------------------------------------- */
    .hidden { display: none !important; }
    .flex    { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-start  { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center  { justify-content: center; }
    .gap-2  { gap: 8px; }
    .gap-3  { gap: 12px; }
    .gap-4  { gap: 16px; }
    .w-full { width: 100%; }
    .grow   { flex: 1; }
    .shrink-0 { flex-shrink: 0; }
    .text-sm { font-size: 12px; }
    .text-xs { font-size: 11px; }
    .mono { font-family: var(--font-mono); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* -------------------------------------------------------------------------
       BADGE
    -------------------------------------------------------------------------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .badge-blue    { background: var(--accent-dim);   color: var(--accent); }
    .badge-green   { background: var(--success-dim);  color: var(--success); }
    .badge-amber   { background: var(--warning-dim);  color: var(--warning); }
    .badge-red     { background: var(--danger-dim);   color: var(--danger); }
    .badge-neutral { background: var(--bg-elevated);  color: var(--text-secondary); }

    /* -------------------------------------------------------------------------
       BUTTONS
    -------------------------------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost    { background: transparent; color: var(--text-secondary); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
    .btn-danger   { background: var(--danger-dim); color: var(--danger); border-color: transparent; }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 11px 24px; font-size: 14px; font-weight: 600; }

    /* -------------------------------------------------------------------------
       FORM CONTROLS
    -------------------------------------------------------------------------- */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.03em; text-transform: uppercase; }
    .form-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      transition: border-color 0.15s;
      width: 100%;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-muted); }
    .form-textarea {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      transition: border-color 0.15s;
      width: 100%;
      min-height: 80px;
    }
    .form-textarea:focus { border-color: var(--accent); }
    .form-textarea::placeholder { color: var(--text-muted); }

    /* -------------------------------------------------------------------------
       CARD
    -------------------------------------------------------------------------- */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
    }
    .card-sm { padding: 14px 16px; }
    .card-hover { transition: border-color 0.15s, background 0.15s; cursor: pointer; }
    .card-hover:hover { border-color: var(--border); background: var(--bg-elevated); }

    /* -------------------------------------------------------------------------
       APP SHELL
    -------------------------------------------------------------------------- */
    #app { height: 100vh; display: flex; flex-direction: column; }

    /* -------------------------------------------------------------------------
       AUTH SCREEN
    -------------------------------------------------------------------------- */
    #view-auth {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59,130,246,0.06) 0%, transparent 70%);
    }
    .auth-box {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .auth-logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .auth-logo span { color: var(--accent); }
    .auth-subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 28px; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 24px; background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 3px; }
    .auth-tab {
      flex: 1;
      padding: 7px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 5px;
      border: none;
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .auth-tab.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }
    .auth-error {
      background: var(--danger-dim);
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* -------------------------------------------------------------------------
       MAIN SHELL (sidebar + content)
    -------------------------------------------------------------------------- */
    #view-app {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .sidebar-logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-user {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .sidebar-section { padding: 16px 10px 8px; }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 6px;
      margin-bottom: 6px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar-item.active { background: var(--accent-dim); color: var(--accent); }
    .sidebar-icon { font-size: 15px; flex-shrink: 0; }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px 10px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Main content area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: var(--topbar-h);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 600; }
    .topbar-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .topbar-breadcrumb .crumb-sep { color: var(--text-muted); }
    .topbar-breadcrumb .crumb-active { color: var(--text-primary); font-weight: 500; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .page-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* -------------------------------------------------------------------------
       DASHBOARD
    -------------------------------------------------------------------------- */
    .dashboard-header { margin-bottom: 20px; }
    .dashboard-header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .dashboard-header p { color: var(--text-secondary); font-size: 13px; }

    .property-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .property-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.12s;
      position: relative;
      overflow: hidden;
    }
    .property-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .property-card:hover { border-color: var(--border); transform: translateY(-1px); }
    .property-card:hover::before { opacity: 1; }
    .property-card-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .property-card-address { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; min-height: 18px; }

    .property-card-footer { display: flex; justify-content: space-between; align-items: center; }
    .property-card-updated { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
      gap: 12px;
    }
    .empty-icon { font-size: 40px; opacity: 0.3; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
    .empty-sub { font-size: 13px; color: var(--text-muted); max-width: 300px; }

    /* -------------------------------------------------------------------------
       PROPERTY DETAIL
    -------------------------------------------------------------------------- */
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .detail-layout { grid-template-columns: 1fr; }
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* JSON data viewer */
    .data-viewer {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .data-viewer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .data-viewer-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .data-viewer-body { padding: 16px; }
    .data-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-row:last-child { border-bottom: none; }
    .data-key {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      flex-shrink: 0;
      width: 170px;
      padding-top: 1px;
    }
    .data-value {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
      word-break: break-all;
      flex: 1;
    }
    .data-empty {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
    }

    /* Conversation list in detail */
    .conv-list { display: flex; flex-direction: column; gap: 8px; }
    .conv-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.12s, background 0.12s;
    }
    .conv-item:hover { border-color: var(--border); background: var(--bg-elevated); }
    .conv-item-left { display: flex; flex-direction: column; gap: 3px; }
    .conv-step { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .conv-date { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .conv-arrow { color: var(--text-muted); font-size: 14px; }

    /* -------------------------------------------------------------------------
       CHAT SCREEN
    -------------------------------------------------------------------------- */
    #view-chat .main-content { overflow: hidden; }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      gap: 3px;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      padding: 0 4px;
    }
    .msg-role {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing-bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-area {
      padding: 12px 24px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-base);
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .chat-textarea {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 13px;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .chat-textarea:focus { outline: none; border-color: var(--accent); }
    .chat-textarea::placeholder { color: var(--text-muted); }
    .chat-actions { display: flex; gap: 8px; margin-top: 10px; }

    /* Commit panel */
    .commit-panel {
      margin: 0 24px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      animation: slide-down 0.2s ease-out;
    }
    @keyframes slide-down {
      from { transform: translateY(-8px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .commit-panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-elevated);
    }
    .commit-panel-title { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .commit-panel-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
    .commit-panel-close:hover { color: var(--text-primary); }
    .commit-panel-body { padding: 14px 16px; }
    .commit-field { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
    .commit-field-key { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 160px; flex-shrink: 0; }
    .commit-field-val { font-family: var(--font-mono); font-size: 11px; }
    .commit-field-val.found { color: var(--success); }
    .commit-field-val.missing { color: var(--warning); }

    /* -------------------------------------------------------------------------
       MODAL
    -------------------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fade-in 0.15s ease-out;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
      animation: modal-pop 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modal-pop {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-header-text { flex: 1; }
    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .modal-subtitle { font-size: 12px; color: var(--text-secondary); }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px;
    }
    .modal-close:hover { color: var(--text-primary); }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 8px;

<body>
<div id="app">
  <!-- VIEWS ARE RENDERED HERE BY JS -->
</div>
<div id="toast-container"></div>

<script>
/* =============================================================================
   CONFIGURATION
============================================================================= */
const API_BASE = ''; // Uses current host (works locally and on Cloud Run seamlessly)

let STEPS = []; // Loaded dynamically from backend

/* =============================================================================
   STATE
============================================================================= */
const State = {
  token: localStorage.getItem('neks_token') || null,
  username: localStorage.getItem('neks_username') || null,
  view: 'dashboard',       // auth | dashboard | detail | chat
  properties: [],
  currentProperty: null,
  currentConversation: null,
  conversations: [],
  messages: [],
};

function setToken(token, username) {
  State.token = token;
  State.username = username;
  localStorage.setItem('neks_token', token);
  localStorage.setItem('neks_username', username);
}

function clearAuth() {
  State.token = null;
  State.username = null;
  localStorage.removeItem('neks_token');
  localStorage.removeItem('neks_username');
}

/* =============================================================================
   API LAYER
============================================================================= */
const API = {
  async request(method, path, body = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (State.token) headers['Authorization'] = `Bearer ${State.token}`;
    const opts = { method, headers };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    if (res.status === 401) { logout(); return null; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
      let msg = err.detail || `HTTP ${res.status}`;
      if (Array.isArray(msg)) {
        msg = msg.map(e => `${e.loc ? e.loc.slice(-1) : 'Field'}: ${e.msg}`).join(', ');
      }
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  },

  async formPost(path, data) {
    const body = new URLSearchParams(data);
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
      let msg = err.detail || `HTTP ${res.status}`;
      if (Array.isArray(msg)) {
        msg = msg.map(e => `${e.loc ? e.loc.slice(-1) : 'Field'}: ${e.msg}`).join(', ');
      }
      throw new Error(msg);
    }
    return res.json();
  },

  get:    (path)        => API.request('GET', path),
  post:   (path, body)  => API.request('POST', path, body),
  put:    (path, body)  => API.request('PUT', path, body),
  delete: (path)        => API.request('DELETE', path),
};

/* =============================================================================
   TOAST
============================================================================= */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* =============================================================================
   ROUTER / RENDER
============================================================================= */
function navigate(view, params = {}) {
  State.view = view;
  Object.assign(State, params);
  render();
}

function render() {
  const app = document.getElementById('app');
  if (!State.token) {
    app.innerHTML = renderAuth();
    bindAuth();
    return;
  }
  // Determine which view to render
  switch (State.view) {
    case 'dashboard': renderDashboard(); break;
    case 'retailers': renderRetailers(); break;
    case 'detail':    renderDetail();    break;
    case 'concepts':  renderConcepts();  break;
    case 'chat':      renderChat();      break;
    case 'agents_config': renderAgentsConfig(); break;
    default:          renderDashboard(); break;
  }
}

/* =============================================================================
   AUTH VIEW
============================================================================= */
function renderAuth() {
  return `
  <div id="view-auth">
    <div class="auth-box">
      <div class="auth-logo">ROITeam<span>.</span></div>
      <p class="auth-subtitle">Агент по исследованию и анализу недвижимости</p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Войти</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      <div id="auth-error" class="auth-error hidden"></div>
      <form id="auth-form" class="flex flex-col gap-3">
        <div class="form-group">
          <label class="form-label">Имя пользователя</label>
          <input id="auth-username" class="form-input" type="text" placeholder="ваше_имя" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input id="auth-password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full" id="auth-submit" style="margin-top:8px">
          Войти
        </button>
      </form>
    </div>
  </div>`;
}

let _authMode = 'login';

function switchAuthTab(mode) {
  _authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('auth-submit').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
  document.getElementById('auth-error').classList.add('hidden');
  document.getElementById('auth-password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
}

function bindAuth() {
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    const btn = document.getElementById('auth-submit');
    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';

    try {
      if (_authMode === 'register') {
        await API.post('/auth/register', { username, password });
      }
      // Always login after register
      const data = await API.formPost('/auth/token', { username, password });
      setToken(data.access_token, username);
      navigate('dashboard');
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = _authMode === 'login' ? 'Войти' : 'Создать аккаунт';
    }
  });
}

function logout() {
  clearAuth();
  _authMode = 'login';
  render();
}

/* =============================================================================
   APP SHELL (sidebar + main area)
============================================================================= */
function shellHtml(breadcrumbs, topbarActions, bodyHtml, activeNav = 'dashboard') {
  const navItems = [
    { id: 'dashboard', icon: '⊞', label: 'Объекты' },
    { id: 'retailers', icon: '☰', label: 'Требования ритейлеров' },

    { id: 'agents_config', icon: '⚙', label: 'Настройки агентов' },
  ];

  if (State.currentProperty) {
    navItems.push({ id: 'detail', icon: '🏠', label: 'Текущий объект' });
  }

  return `
  <div id="view-app" class="flex" style="height:100vh;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">ROITeam<span>.</span></div>
        <div class="sidebar-user">${escHtml(State.username || '')}</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Навигация</div>
        ${navItems.map(n => `
          <button class="sidebar-item ${activeNav === n.id ? 'active' : ''}" onclick="navigate('${n.id}')">
            <span class="sidebar-icon">${n.icon}</span>
            ${n.label}
          </button>`).join('')}
      </div>
      <div class="sidebar-footer">
        <button class="sidebar-item" onclick="logout()">
          <span class="sidebar-icon">↩</span>
          Выйти
        </button>
      </div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div class="topbar-breadcrumb">${breadcrumbs}</div>
        <div class="topbar-actions">${topbarActions}</div>
      </div>
      <div class="page-body">
        ${bodyHtml}
      </div>
    </div>
  </div>`;
}

/* =============================================================================
   AGENTS CONFIG VIEW
============================================================================= */
window.addAgentStep = function() {
  const stepKey = prompt("Введите уникальный ключ нового шага (например, step_6_custom):");
  if (!stepKey) return;
  if (State.agentsConfig[stepKey]) {
    alert("Шаг с таким ключом уже существует!");
    return;
  }
  State.agentsConfig[stepKey] = {
    title: "Новый агент",
    description: "",
    system_prompt: "",
    first_user_message: "",
    available_tools: [],
    required_fields: [],
    injected_context: [],
    extraction_schema: {}
  };
  renderAgentsConfig(false);
};

window.deleteAgentStep = function(stepKey) {
  if (confirm(`Вы уверены, что хотите удалить шаг "${stepKey}"?`)) {
    delete State.agentsConfig[stepKey];
    renderAgentsConfig(false);
  }
};

      );
      return;
    }
  }

  let bodyHtml = `
  <style>
    .agent-accordion {

    }
    .agent-accordion summary {
      padding: 16px;
      font-size: 1rem;

      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-elevated);
      transition: background 0.2s ease;

      list-style: none; /* Hide default triangle */
    }

      display: none;
    }
    .agent-accordion summary:hover {
      background: rgba(255,255,255,0.05);
    }

      border-bottom: 1px solid var(--border-light);
    }
    .agent-accordion summary .chevron {
      transition: transform 0.2s ease;
      opacity: 0.5;
    }
    .agent-accordion[open] summary .chevron {
      transform: rotate(180deg);
    }
    .agent-accordion-body {
      padding: 16px;
      background: var(--bg-card);
    }
  </style>
  <div class="flex flex-col gap-4" style="padding-bottom: 40px; max-width: 900px; margin: 0 auto;">`;
  
  for (const [agentKey, agent] of Object.entries(State.agentsConfig)) {
    bodyHtml += `
    <details class="agent-accordion">
      <summary>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="badge badge-blue" style="font-family: monospace; font-size: 0.85rem;">${escHtml(agentKey)}</span>

async function saveAgentsConfig() {
  if (!State.agentsConfig) return;
  const btn = document.getElementById('btn-save-agents');
  const originalText = btn.textContent;
  btn.textContent = 'Сохранение...';
  btn.disabled = true;

  try {
    await API.put('/system/agents-config/json', { config: State.agentsConfig });
    alert('Конфигурация успешно сохранена и перезагружена!');
  } catch (err) {
    alert('Ошибка при сохранении: ' + err.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

/* =============================================================================
   DASHBOARD VIEW
============================================================================= */
async function renderDashboard() {
  const app = document.getElementById('app');
  // Show skeleton while loading
  app.innerHTML = shellHtml(
    `<span class="crumb-active">Объекты</span>`,
    `<button class="btn btn-primary btn-sm" onclick="openNewPropertyModal()">+ Новый объект</button>`,
    `<div class="page-loader"><div class="spinner"></div> Загрузка…</div>`,
    'dashboard'
  );

    State.properties = await API.get('/properties') || [];
    renderDashboardContent();
  } catch (err) {
    toast('Не удалось загрузить объекты: ' + err.message, 'error');
    renderDashboardContent();
  }
}

function renderDashboardContent() {

  if (!body) return;

    ? `<div class="empty-state">

       </div>`
    : `<div class="property-grid">${props.map(propertyCard).join('')}</div>`;

  body.innerHTML = `
    <div class="dashboard-header">
      <h1>Объекты</h1>
      <p>${props.length} ${props.length === 1 ? 'объект отслеживается' : 'объектов отслеживается'}</p>
    </div>
    ${cards}`;
}

function propertyCard(p) {
  const data = p.data || {};
  const keys = Object.keys(data);
  const fieldCount = keys.length;
  const updated = p.updated_at ? relTime(p.updated_at) : 'никогда';

  return `
  <div class="property-card" onclick="openProperty('${p.id}')">
    <div class="property-card-name">${escHtml(p.name)}</div>
    <div class="property-card-address">${escHtml(p.address || 'Адрес не указан')}</div>
    <div class="property-card-footer" style="margin-top: 12px;">
      <span class="badge badge-neutral"><span class="field-count">${fieldCount}</span> полей</span>
      <span class="property-card-updated">${updated}</span>
    </div>
  </div>`;
}

function getStepFields(stepId) {
  const map = {
    step_1_city_analyst: { city_name:1, macro_economic_trend:1, demographic_trend:1, general_market_health:1 },
    step_2_object_location: { exact_location:1, micro_location_rating:1, infrastructure_quality:1, direct_competitors:1, square_meters:1, floors:1 },
    step_3_concept_developer: { generated_concepts:1 },
    step_4_tenant_mix: { finalized_concepts:1 }
  };
  return map[stepId] || {};
}

async function autoFillRetailer() {
  const company = document.getElementById('ret_company').value.trim();
  const brand = document.getElementById('ret_brand').value.trim();
  if (!company || !brand) {
    return toast('Компания и Бренд обязательны для ИИ поиска', 'error');
  }

  const btn = document.getElementById('auto-fill-btn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Ищем...';
  btn.disabled = true;

  try {
    const res = await fetch('/retailers/auto-fill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + State.token },
      body: JSON.stringify({ company, brand })
    });
    
    if (!res.ok) {
      const err = await res.json();
      alert('Ошибка при поиске: ' + (err.detail || res.statusText));
      return;
    }
    
    const data = await res.json();
    
    // Fill values if they exist
    if (data.area_sqm) {
      if (data.area_sqm.min !== null && data.area_sqm.min !== undefined) document.getElementById('ret_area_min').value = data.area_sqm.min;
      if (data.area_sqm.max !== null && data.area_sqm.max !== undefined) document.getElementById('ret_area_max').value = data.area_sqm.max;
    }
    if (data.power_kw) {
      if (data.power_kw.min !== null && data.power_kw.min !== undefined) document.getElementById('ret_power_min').value = data.power_kw.min;
      if (data.power_kw.max !== null && data.power_kw.max !== undefined) document.getElementById('ret_power_max').value = data.power_kw.max;
    }
    if (data.ceilings_m) {
      if (data.ceilings_m.min !== null && data.ceilings_m.min !== undefined) document.getElementById('ret_ceilings_min').value = data.ceilings_m.min;
      if (data.ceilings_m.max !== null && data.ceilings_m.max !== undefined) document.getElementById('ret_ceilings_max').value = data.ceilings_m.max;
    }
    if (data.requirements) {
      document.getElementById('ret_reqs').value = data.requirements;
    }
    
  } catch (e) {
    console.error(e);
    alert('Ошибка сети или сервера');
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}

async function saveRetailer() {
  const btn = document.getElementById('save-ret-btn');
  const id = document.getElementById('retailer_id').value;
  
  const getNum = (val) => val.trim() === '' ? null : parseFloat(val);

  const payload = {
    company: document.getElementById('ret_company').value.trim(),
    brand: document.getElementById('ret_brand').value.trim(),
    format: document.getElementById('ret_format').value.trim(),
    requirements: document.getElementById('ret_reqs').value.trim(),
    area_sqm: { min: getNum(document.getElementById('ret_area_min').value), max: getNum(document.getElementById('ret_area_max').value) },
    power_kw: { min: getNum(document.getElementById('ret_power_min').value), max: getNum(document.getElementById('ret_power_max').value) },
    ceilings_m: { min: getNum(document.getElementById('ret_ceilings_min').value), max: getNum(document.getElementById('ret_ceilings_max').value) }
  };

  if (!payload.company || !payload.brand) {
    return toast('Компания и Бренд обязательны', 'error');
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    const method = id ? 'PUT' : 'POST';
    const url = id ? '/retailers/' + id : '/retailers';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + State.token },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      toast('Ритейлер ' + (id ? 'обновлен' : 'добавлен'), 'success');
      closeModal();
      if (State.view === 'retailers') renderRetailers();
    } else {
      const err = await res.json();
      toast('Ошибка: ' + (err.detail || 'Неизвестно'), 'error');
    }
  } catch (e) {
    toast('Ошибка сети', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerText = id ? 'Сохранить' : 'Добавить'; }
  }
}

async function deleteRetailer(id) {
  if (!confirm('Удалить этого ритейлера?')) return;
  try {
    const res = await fetch('/retailers/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + State.token }
    });
    if (res.ok) {
      toast('Ритейлер удален', 'success');
      closeModal();
      if (State.view === 'retailers') renderRetailers();
    } else {
      toast('Ошибка удаления', 'error');
    }
  } catch(e) {
    toast('Ошибка сети', 'error');
  }
}

function formatDataValue(val) {
  if (Array.isArray(val)) {
    if (val.length === 0) return escHtml('Ничего не найдено (пустой список)');
    if (val.length > 0 && typeof val[0] === 'object' && val[0] !== null) {
      return `<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">` + 
        val.map(item => `
          <div style="background:var(--bg-secondary);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border-color);">
            ${Object.entries(item).map(([k, v]) => `
              <div style="margin-bottom:6px;font-size:13px;line-height:1.4;">
                <span style="color:var(--text-secondary);font-weight:500;margin-right:4px;">${escHtml(DISPLAY_LABELS[k] || k)}:</span>
                <span style="color:var(--text-primary);">${formatDataValue(v)}</span>
              </div>
            `).join('')}
          </div>
        `).join('') + `</div>`;
    }
    return escHtml(val.join(', '));
  } else if (typeof val === 'object' && val !== null) {
    return escHtml(JSON.stringify(val));
  }
  return escHtml(String(val));
}

function renderDetailContent() {

  if (!body) return;

  // Update breadcrumb
  const crumbActive = document.querySelector('.crumb-active');
  if (crumbActive) crumbActive.textContent = prop.name;

  const data = prop.data || {};
  const dataKeys = Object.keys(data);

  const dataViewerRows = dataKeys.length === 0
    ? `<div class="data-empty">Данные еще не сохранены. Начните диалог, чтобы начать исследование.</div>`
    : dataKeys.map(k => {
        return `<div class="data-row">
          <div class="data-key" style="font-weight:600;">${escHtml(DISPLAY_LABELS[k] || String(k))}</div>
          <div class="data-value-wrapper" style="width: 100%;">
            <div class="data-value expandable-content">${formatDataValue(data[k])}</div>
            <button class="expand-btn" onclick="toggleExpand(this)">Развернуть</button>
          </div>

function toggleExpand(btn) {
  const content = btn.previousElementSibling;
  content.classList.toggle('expanded');
  btn.textContent = content.classList.contains('expanded') ? 'Свернуть' : 'Развернуть';
}

function applyExpandButtons() {
  document.querySelectorAll('.expandable-content').forEach(el => {
    // If the scrollHeight is strictly greater than clientHeight, it means it's truncated by line-clamp
    if (el.scrollHeight > el.clientHeight) {
      el.nextElementSibling.style.display = 'block';
    }
  });
}

async function loadДиалоги(propId) {
  // The API doesn't have a list-by-property endpoint; we'll keep a lightweight
  // local cache based on conversations we've started this session.
  // For a full solution, add GET /properties/{id}/conversations to the backend.
  const container = document.getElementById('conv-list-container');
  if (!container) return;

  if (State.conversations.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding:32px 16px">
        <div class="empty-icon" style="font-size:28px">💬</div>
        <div class="empty-title">Пока нет диалогов</div>
        <div class="empty-sub">Начните этап, чтобы запустить процесс исследования.</div>
      </div>`;
    return;
  }

  // Filter conversations for this property
  const propConvs = State.conversations.filter(c => c.property_id === propId);
  if (propConvs.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding:32px 16px">
        <div class="empty-icon" style="font-size:28px">💬</div>
        <div class="empty-title">Пока нет диалогов</div>
        <div class="empty-sub">Начните этап, чтобы запустить процесс исследования.</div>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="conv-list">
    ${propConvs.map(c => {
      const stepDef = STEPS.find(s => s.id === c.current_step);
      const label = stepDef ? stepDef.label : c.current_step;
      const statusClass = c.status === 'completed' ? 'badge-green' : 'badge-blue';
      return `
      <div class="conv-item" onclick="openConversation('${c.id}')">
        <div class="conv-item-left">
          <div class="conv-step">${escHtml(label)}</div>
          <div class="conv-date">${relTime(c.created_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${statusClass}">${c.status}</span>
          <button class="btn btn-ghost btn-sm" style="padding:4px" onclick="event.stopPropagation(); deleteConversation('${c.id}')" title="Удалить диалог">🗑️</button>
          <span class="conv-arrow">›</span>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

async function deleteConversation(id) {
  if (!confirm('Вы уверены, что хотите удалить этот диалог?')) return;
  try {
    await API.delete(`/conversations/${id}`);
    toast('Диалог удален', 'success');
    State.conversations = State.conversations.filter(c => c.id !== id);
    if (State.currentProperty) {
      loadДиалоги(State.currentProperty.id);
    }
  } catch (err) {
    toast('Ошибка удаления: ' + err.message, 'error');
  }
}

async function downloadPresentation(id) {
  toast('Генерируем презентацию... Пожалуйста, подождите.', 'info');
  try {
    const res = await fetch(API_BASE + `/properties/${id}/slides`, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('neks_token')
      }
    });
    if (!res.ok) throw new Error('Не удалось сгенерировать презентацию');
    
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Presentation_Property_${id}.pptx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    toast('Презентация готова!', 'success');
  } catch (err) {
    toast(err.message, 'error');
  }
}

let _selectedStep = null;

function openStepModal() {
  _selectedStep = STEPS[0].id;
  const stepOptions = STEPS.map((s, i) => `
    <div class="step-option ${i === 0 ? 'selected' : ''}" id="step-opt-${s.id}" onclick="selectStep('${s.id}')">
      <div class="step-option-radio"></div>
      <div>
        <div class="step-option-title">${s.label}</div>
        <div class="step-option-desc">${s.desc}</div>
      </div>
    </div>`).join('');

  const html = `
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-text">
          <div class="modal-title">Начать новый этап</div>
          <div class="modal-subtitle">Выберите этап анализа для этого объекта</div>
        </div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        ${stepOptions}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Отмена</button>
        <button type="button" class="btn btn-primary" id="start-step-btn" onclick="validateAndStartStep()">Продолжить →</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function selectStep(stepId) {
  _selectedStep = stepId;
  STEPS.forEach(s => {
    const el = document.getElementById(`step-opt-${s.id}`);
    if (el) el.classList.toggle('selected', s.id === stepId);
  });
}

async function validateAndStartStep() {
  const prop = State.currentProperty;
  if (!prop || !_selectedStep) return;

  const btn = document.getElementById('start-step-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    const validation = await API.get(
      `/conversations/validate?property_id=${prop.id}&step=${_selectedStep}`
    );

    if (validation && validation.missing_fields && validation.missing_fields.length > 0) {
      closeModal();
      openValidationWarningModal(validation.missing_fields, _selectedStep, prop.id);
    } else {
      await startConversation(prop.id, _selectedStep);
    }
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Продолжить →';
  }
}

function openValidationWarningModal(missingFields, stepId, propId) {
  const stepDef = STEPS.find(s => s.id === stepId);
  const stepLabel = stepDef ? stepDef.label : stepId;
  const pills = missingFields.map(f => `<span class="missing-field-pill">${escHtml(f)}</span>`).join('');

  const html = `
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-text">
          <div class="modal-title">⚠ Отсутствуют данные</div>
          <div class="modal-subtitle">${escHtml(stepLabel)} может дать неполные результаты</div>
        </div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:8px">
          Следующие поля из предыдущего этапа отсутствуют в данных этого объекта.
          Вы можете продолжить — агент сделает предположения для недостающего контекста.
        </p>
        <div class="missing-field-list">${pills}</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Отмена</button>
        <button type="button" class="btn btn-primary" id="bypass-btn" onclick="bypassAndStart('${propId}', '${stepId}')">
          Все равно продолжить
        </button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function bypassAndStart(propId, stepId) {
  const btn = document.getElementById('bypass-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>'; }
  await startConversation(propId, stepId);
}

async function startConversation(propId, stepId) {
  try {
    const conv = await API.post('/conversations', {
      property_id: String(propId),
      current_step: stepId,
    });
    if (!conv) { toast('Не удалось начать диалог', 'error'); return; }
    State.conversations.push(conv);
    State.currentConversation = conv;
    closeModal();
    toast('Диалог начат', 'success');
    openConversation(conv.id);
  } catch (err) {
    toast(err.message, 'error');
  }
}

/* =============================================================================
   CONVERSATION OPEN
============================================================================= */
async function openConversation(convId) {
  // Find or fetch the conversation
  let conv = State.conversations.find(c => c.id === convId);
  if (!conv) {
    try {
      const data = await API.get(`/conversations/${convId}`);
      if (!data) { navigate('detail'); return; }
      conv = data;
      // Update current property if needed
      if (!State.currentProperty || State.currentProperty.id !== data.property_id) {
        const prop = await API.get(`/properties/${data.property_id}`);
        if (prop) State.currentProperty = prop;
      }
    } catch (err) {
      toast(err.message, 'error');
      return;
    }
  }
  State.currentConversation = conv;
  navigate('chat');
}

      </div>

      <div id="commit-panel-area"></div>

      <div class="chat-body" id="chat-body">
        <div class="page-loader"><div class="spinner"></div></div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea
            id="chat-input"
            class="chat-textarea"
            placeholder="${conv.status === 'completed' ? 'Этот диалог завершен.' : 'Введите ваше сообщение…'}"
            ${conv.status === 'completed' ? 'disabled' : ''}
            rows="1"
            onkeydown="handleChatKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="btn btn-primary" id="send-btn" onclick="sendMessage()"
            ${conv.status === 'completed' ? 'disabled' : ''}>
            Send
          </button>
        </div>
        ${conv.status === 'active' ? `
        <div class="chat-actions">
          <button class="btn btn-ghost btn-sm" onclick="commitConversation()">📋 Сохранить результаты</button>
          <button class="btn btn-ghost btn-sm" onclick="navigate('detail')">← Назад к объекту</button>
        </div>` : `
        <div class="chat-actions">
          <button class="btn btn-ghost btn-sm" onclick="navigate('detail')">← Назад к объекту</button>
        </div>`}
      </div>
    </div>
  </div>`;

  await loadMessages();
}

async function loadMessages() {
  const chatBody = document.getElementById('chat-body');
  if (!chatBody) return;
  const conv = State.currentConversation;
  try {
    const data = await API.get(`/conversations/${conv.id}`);
    if (!data) { chatBody.innerHTML = '<div class="data-empty">Не удалось загрузить сообщения.</div>'; return; }
    State.messages = data.messages || [];
    renderMessages();
  } catch (err) {
    chatBody.innerHTML = `<div class="data-empty">${escHtml(err.message)}</div>`;
  }
}

function renderMessages() {
  const chatBody = document.getElementById('chat-body');
  if (!chatBody) return;
  const msgs = State.messages;
  if (msgs.length === 0) {
    const stepDef = STEPS.find(s => s.id === State.currentConversation?.current_step);
    chatBody.innerHTML = `
      <div class="empty-state" style="padding:48px 24px">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">Начните диалог</div>
        <div class="empty-sub">${stepDef ? stepDef.desc : 'Отправьте сообщение, чтобы начать.'}</div>
      </div>`;
    return;
  }
  chatBody.innerHTML = msgs
    .filter(m => m.role !== 'system')
    .map(m => {
      const timeStr = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      return `
      <div class="msg ${m.role}">
        <div class="msg-role">${m.role === 'user' ? 'You' : 'Agent'}</div>
        <div class="msg-bubble markdown-body">${marked.parse(m.content)}</div>
        <div class="msg-time">${timeStr}</div>
      </div>`;
    }).join('');
  chatBody.scrollTop = chatBody.scrollHeight;
}

function showTyping() {
  const chatBody = document.getElementById('chat-body');
  if (!chatBody) return;
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.id = 'typing-indicator';
  el.innerHTML = `
    <div class="msg-role">Агент</div>
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  chatBody.appendChild(el);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  if (!input || !sendBtn) return;
  const content = input.value.trim();
  if (!content) return;
  const conv = State.currentConversation;
  if (!conv || conv.status === 'completed') return;

  input.value = '';
  input.style.height = '';
  input.disabled = true;
  sendBtn.disabled = true;

  // Optimistically render user message
  const optimistic = { role: 'user', content, created_at: new Date().toISOString() };
  State.messages.push(optimistic);
  renderMessages();
  showTyping();

  try {
    const data = await API.post(`/conversations/${conv.id}/message`, { content });
    if (data && data.agent_message) {
      State.messages.push(data.agent_message);
    } else {
      toast('Нет ответа от агента', 'error');
    }
  } catch (err) {
    toast('Ошибка отправки: ' + err.message, 'error');
    State.messages.pop(); // Remove optimistic message on error
  } finally {
    hideTyping();
    renderMessages();
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

/* =============================================================================
   COMMIT
============================================================================= */
async function commitConversation() {
  const conv = State.currentConversation;
  if (!conv) return;
  const btn = document.querySelector('[onclick="commitConversation()"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Сохранение...'; }

  try {
    const result = await API.post(`/conversations/${conv.id}/commit`);
    if (!result) { toast('Сохранение не вернуло данных', 'error'); return; }
    toast('Результаты сохранены', 'success');

    const updatedConv = await API.post(`/conversations/${conv.id}/complete`);
    if (updatedConv) {
      const idx = State.conversations.findIndex(c => c.id === updatedConv.id);
      if (idx !== -1) State.conversations[idx] = updatedConv;
    }
    
    // Refresh property data to fetch newly extracted info
    const prop = await API.get(`/properties/${conv.property_id}`);
    if (prop) State.currentProperty = prop;

    // Determine next step
    const currentIndex = STEPS.findIndex(s => s.id === conv.step_id);
    if (currentIndex !== -1 && currentIndex + 1 < STEPS.length) {
      const nextStep = STEPS[currentIndex + 1];
      toast(`Переход к этапу: ${nextStep.label.split(':')[0]}`, 'info');
      
      const newConv = await API.post('/conversations', { property_id: conv.property_id, step_id: nextStep.id });
      if (newConv) {
        State.currentConversation = newConv;
        State.conversations.push(newConv);
        renderChat();
      }
    } else {
      if (currentIndex === -1) {
        toast('Устаревшая сессия завершена. Начните следующий этап вручную.', 'info');
      } else {
        toast('Все этапы завершены', 'success');
      }
      openProperty(conv.property_id);
    }
  } catch (err) {
    toast('Ошибка сохранения: ' + err.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📋 Сохранить результаты'; }
  }
}




/* =============================================================================
   MODAL HELPERS
============================================================================= */
function closeModal() {
  const el = document.getElementById('modal-backdrop');
  if (el) el.remove();
}

function closeModalOnBackdrop(e) {
  if (e.target.id === 'modal-backdrop') closeModal();
}

/* =============================================================================
   CONCEPTS VIEW
============================================================================= */
async function renderConcepts() {
  const app = document.getElementById('app');
  app.innerHTML = shellHtml(
    `<span class="crumb-active">Глобальные концепции</span>`,
    `<button class="btn btn-primary btn-sm" onclick="openConceptModal()">+ Добавить концепцию</button>`,
    `<div class="page-loader"><div class="spinner"></div> Загрузка…</div>`,
    'concepts'
  );

  try {
    const concepts = await API.get(`/concepts`);
    renderConceptsContent(concepts || []);
  } catch (err) {
    toast('Ошибка загрузки концепций: ' + err.message, 'error');
  }
}

function renderConceptsContent(concepts) {
  const body = document.querySelector('.page-body');
  if (!body) return;

  window._conceptsList = concepts;

  if (concepts.length === 0) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❖</div>
        <div class="empty-title">Нет концепций</div>
        <div class="empty-sub">Вы еще не добавили ни одной глобальной концепции.</div>
      </div>
    `;
    return;
  }

  const cardsHtml = concepts.map(c => `
    <div class="property-card" onclick="openConceptModal('${c.id}')">
      <div class="property-card-name">${escHtml(c.name)}</div>
      <div class="property-card-address">${escHtml(c.format_type)}</div>
      <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">
        <strong>Целевая аудитория:</strong><br/>
        <span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;">${escHtml(c.target_audience || '-')}</span>
      </div>
      <div class="property-card-footer">
        <div class="property-card-updated">Нажмите, чтобы изменить</div>
      </div>
    </div>
  `).join('');

  body.innerHTML = `
    <div class="property-grid">
      ${cardsHtml}
    </div>
  `;
}

function openConceptModal(id = null) {
  let c = null;
  if (id && window._conceptsList) {
    c = window._conceptsList.find(x => x.id === id);
  }

  const title = c ? 'Изменить концепцию' : 'Новая концепция';
  const saveBtn = c ? 'Сохранить' : 'Добавить';

  const html = `
    <div class="modal-backdrop" id="modal-backdrop" onclick="closeModalOnBackdrop(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-header-text">
            <div class="modal-title">${title}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
          <input type="hidden" id="concept-id" value="${c ? c.id : ''}">
          
          <div class="form-group">
            <label class="form-label">Название концепции</label>
            <input type="text" id="concept-name" class="form-input" placeholder="Например: Районный ТЦ" value="${c ? escAttr(c.name) : ''}">
          </div>
          
          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Тип формата</label>
            <input type="text" id="concept-format" class="form-input" placeholder="Например: Neighborhood Center" value="${c ? escAttr(c.format_type) : ''}">
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Стратегия позиционирования</label>
            <textarea id="concept-positioning" class="form-textarea" rows="3">${c ? escHtml(c.positioning_strategy) : ''}</textarea>
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Целевая аудитория</label>
            <textarea id="concept-audience" class="form-textarea" rows="3">${c ? escHtml(c.target_audience) : ''}</textarea>
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Якорная стратегия</label>
            <textarea id="concept-anchor" class="form-textarea" rows="3">${c ? escHtml(c.anchor_strategy) : ''}</textarea>
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Гайдлайны по арендаторам</label>
            <textarea id="concept-tenant" class="form-textarea" rows="3">${c ? escHtml(c.tenant_guidelines) : ''}</textarea>
          </div>

        </div>
        <div class="modal-footer">
          ${c ? `<button class="btn btn-danger" onclick="deleteConcept('${c.id}')" style="margin-right: auto;">Удалить</button>` : ''}
          <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
          <button class="btn btn-primary" id="save-concept-btn" onclick="saveConcept()">${saveBtn}</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function saveConcept() {
  const id = document.getElementById('concept-id').value;
  const btn = document.getElementById('save-concept-btn');
  
  const payload = {
    name: document.getElementById('concept-name').value.trim(),
    format_type: document.getElementById('concept-format').value.trim(),
    positioning_strategy: document.getElementById('concept-positioning').value.trim(),
    target_audience: document.getElementById('concept-audience').value.trim(),
    anchor_strategy: document.getElementById('concept-anchor').value.trim(),
    tenant_guidelines: document.getElementById('concept-tenant').value.trim(),
  };

  if (!payload.name) {
    toast('Введите название концепции', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Сохранение...';

  try {
    if (id) {
      await API.put(`/concepts/${id}`, payload);
      toast('Концепция обновлена', 'success');
    } else {
      await API.post(`/concepts`, payload);
      toast('Концепция создана', 'success');
    }
    closeModal();
    renderConcepts(); // re-render
  } catch (err) {
    toast('Ошибка сохранения: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Сохранить';
  }
}

async function deleteConcept(id) {
  if (!confirm('Удалить эту концепцию навсегда?')) return;
  try {
    await API.delete(`/concepts/${id}`);
    toast('Концепция удалена', 'success');
    closeModal();
    renderConcepts();
  } catch (err) {
    toast('Ошибка удаления: ' + err.message, 'error');
  }
}

/* =============================================================================
   HELPERS
============================================================================= */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escAttr(str) {
  return escHtml(str);
}

function relTime(isoStr) {
  if (!isoStr) return '';
  const date = new Date(isoStr);
  const diff = Date.now() - date.getTime();
  const secs = Math.floor(diff / 1000);
  if (secs < 60)   return 'только что';
  if (secs < 3600) return `${Math.floor(secs/60)}м назад`;
  if (secs < 86400)return `${Math.floor(secs/3600)}ч назад`;
  return `${Math.floor(secs/86400)}д назад`;
}

/* =============================================================================
   BOOT
============================================================================= */
async function boot() {
  try {
    const res = await fetch(`${API_BASE}/steps`);
    if (res.ok) {
      STEPS = await res.json();
    } else {
      console.error('Failed to load steps');
      toast('Не удалось загрузить агентов', 'error');
    }
  } catch (err) {
    console.error('Network error loading steps', err);
    toast('Ошибка сети при загрузке агентов', 'error');
  }
  render();
}
boot();
</script>
