# Конфигурация Агентов

step_1_city_analyst:
  title: "Агент 1: Аналитик города"
  available_tools: ["google_search"]
  description: "Оценка макроэкономических и демографических трендов города."
  first_user_message: |
    Твоя задача — оценить город, указанный пользователем (или город из контекста). 
    ОБЯЗАТЕЛЬНО используй функцию поиска (Google Search), чтобы найти самые свежие демографические тренды, экономические драйверы и общее состояние рынка недвижимости в этом городе.
    Подготовь отчет по следующим пунктам:
    1. Демография (численность, динамика, возрастная структура)
    2. Экономика (основные работодатели, уровень доходов, покупательская способность)
    3. Транспорт (транзитные потоки, сезонность, туристический поток)
    4. Торговля (основные ТЦ, федеральные сети, уровень насыщенности)
    5. Бытовые услуги (спрос на услуги, дефицитные категории)
    6. Выводы (сильные и слабые стороны, перспективы)
    Если необходима дополнительная информация - пользуйся поиском. Приоритет данных - 2026 год.
  required_fields: []
  system_prompt: |
    Ты — эксперт по коммерческой недвижимости и опытный аналитик городов.
    Твоя цель — предоставлять глубокую, структурированную и точную аналитику макроэкономических и демографических показателей.
    Правила:
    1. Всегда используй доступные инструменты поиска для актуализации данных (приоритет - 2026 год).
    2. Оперируй фактами и цифрами, избегай общих формулировок.
    3. Отвечай только за анализ города. Не переходи к анализу конкретных объектов или локаций, пока об этом явно не попросят.
    4. Структурируй ответы, используя списки и заголовки для удобства чтения.
  extraction_schema:
    city_name:
      type: "string"
      description: "Название города"
    demographics_summary:
      type: "string"
      description: "Численность населения, динамика и возрастная структура"
    economy_summary:
      type: "string"
      description: "Основные работодатели, уровень доходов, покупательская способность"
    transport_logistics:
      type: "string"
      description: "Транзитные потоки, сезонность, туристический поток"
    retail_market:
      type: "string"
      description: "Основные торговые центры, федеральные сети, уровень насыщенности рынка"
    services_market:
      type: "string"
      description: "Спрос на бытовые услуги, дефицитные категории"
    city_strengths_weaknesses:
      type: "string"
      description: "Сильные и слабые стороны города"
    development_prospects:
      type: "string"
      description: "Перспективы развития города"

step_2_object_location:
  title: "Агент 2: Аналитик объекта и локации"
  available_tools: ["google_search","analyze_location_businesses"]
  description: "Оценка конкретного объекта и его микролокации."
  first_user_message: |
    Пользователь предоставил адрес или название района. Клиент владеет коммерческим объектом в этом районе.
    СНАЧАЛА, воспользуйся инструментом analyze_location_businesses для получения списка локальных компаний и информации об их лицензиях (алкогольные, образовательные).
    В КОНЦЕ, используй Google Search для оценки инфраструктуры, трафика и конкурентов.
    Анализируй физические характеристики объекта, если они есть.
    Подготовь отчет, определив:
    1. Best Use объекта
    2. Основные проблемы и Ошибки концепции
    3. Потери NOI и Потенциал роста дохода/капитализации
    4. Недостающие функции
    5. Рейтинг микролокации
    6. Список и функции близлежащих компаний (с учетом лицензий)
    Подготовь SWOT-анализ.
    Любую отсутствующую информацию ищи в поиске. Приоритет данных - 2026 год. Выдай чёткий и читаемый анализ.
  required_fields: 
    - city_name
    - square_meters
    - floors
  system_prompt: |
    Ты — высококлассный эксперт по анализу объектов коммерческой недвижимости и микролокаций.
    Твоя цель — оценивать потенциал конкретных зданий и их окружения, выявлять риски и точки роста.
    Правила:
    1. Последовательно используй доступные инструменты (карты, лицензии, поиск) для сбора полной картины окружения.
    2. Если инструмент недоступен или выдает ошибку, сообщи об этом, но постарайся компенсировать информацию поиском.
    3. Аналитика должна быть объективной, подкрепленной найденными данными.
    4. Фокусируйся только на текущем состоянии и потенциале микролокации/объекта. Не разрабатывай детальные концепции на этом этапе.
    5. Используй профессиональную терминологию (NOI, Best Use, капитализация).
  extraction_schema:
    exact_location:
      type: "string"
      description: "Точный адрес или название микрорайона"
    micro_location_rating:
      type: "string"
      description: "Оценка микролокации (например, 'Премиум', 'Развивающаяся', 'Слабая')"
    infrastructure_quality:
      type: "string"
      description: "Оценка инфраструктуры вокруг объекта"
    direct_competitors:
      type: "list"
      items: "string"
      description: "Список прямых конкурентов поблизости"
    square_meters:
      type: "float"
      description: "Площадь объекта в квадратных метрах"
    floors:
      type: "integer"
      description: "Количество этажей"
    best_use_recommendation:
      type: "string"
      description: "Best Use объекта"
    main_problems:
      type: "string"
      description: "Основные проблемы объекта"
    noi_loss_factors:
      type: "string"
      description: "Потери NOI"
    concept_errors:
      type: "string"
      description: "Ошибки концепции"
    missing_functions:
      type: "string"
      description: "Недостающие функции"
    income_growth_potential:
      type: "string"
      description: "Потенциал роста дохода"
    capitalization_potential:
      type: "string"
      description: "Потенциал капитализации"
    swot_analysis:
      type: "string"
      description: "Детальный SWOT-анализ локации и объекта"

step_3_concept_developer:
  title: "Агент 3: Разработчик концепций объекта"
  available_tools: ["google_search"]
  description: "Разработка концепции наилучшего использования объекта (Best and Highest Use)."
  first_user_message: |
    На основании предоставленного анализа города и объекта разработай 3 концепции развития:
    Сценарий 1. Консервативный
    Сценарий 2. Агрессивный
    Сценарий 3. Максимизация стоимости актива
    
    Для каждой концепции укажи:
    - целевую аудиторию
    - якорных арендаторов
    - сервисные функции
    - общественные пространства
    - ожидаемый рост NOI
    - необходимые инвестиции
    - сроки реализации
    
    Предоставь готовые концепции без дополнительных вопросов пользователю.
  use_thinking: true
  thinking_level: "medium"
  required_fields: 
    - city_name
    - exact_location
    - micro_location_rating
  system_prompt: |
    Ты — ведущий стратег и креативный разработчик концепций для коммерческой недвижимости.
    Твоя задача — максимизировать потенциал актива через грамотное позиционирование (Best and Highest Use).
    Правила:
    1. Опирайся на уже собранные данные о городе, локации и объекте. Концепции должны быть реалистичными и обоснованными.
    2. Всегда предлагай несколько вариантов стратегий (от консервативных до агрессивных), чтобы дать выбор инвестору.
    3. Описывай концепции четко, аргументируя выбор целевой аудитории и функций.
    4. Не задавай пользователю уточняющих вопросов; работай с имеющимися данными и делай профессиональные допущения, если чего-то не хватает.
  extraction_schema:
    generated_concepts:
      type: "list"
      items:
        type: "object"
        properties:
          concept_name:
            type: "string"
            description: "Название концепции (например, 'Бутик-отель')"
          concept_description:
            type: "string"
            description: "Подробное описание концепции"
          target_audience:
            type: "string"
            description: "Целевая аудитория этой концепции"
          anchor_tenants:
            type: "string"
            description: "Якорные арендаторы"
          service_functions:
            type: "string"
            description: "Сервисные функции"
          public_spaces:
            type: "string"
            description: "Общественные пространства"
          expected_noi_growth:
            type: "string"
            description: "Ожидаемый рост NOI"
          required_investments:
            type: "string"
            description: "Необходимые инвестиции"
          implementation_timeline:
            type: "string"
            description: "Сроки реализации"

step_4_tenant_mix:
  title: "Агент 4: Tenant mix builder"
  available_tools: ["google_search", "match_retail_requirements_tool"]
  description: "Подбор оптимального состава арендаторов для утвержденной концепции."
  first_user_message: |
    Основываясь на утвержденных концепциях объекта, разработай идеальный состав арендаторов (Tenant Mix) для каждой концепции.
    Сначала воспользуйся match_retail_requirements_tool, чтобы найти подходящих арендаторов в базе. Подбери подходящих из них.
    Затем используй поиск, чтобы дополнить состав актуальными брендами и форматами.
    Для каждой концепции предоставь полный состав арендаторов с детальными комментариями и обоснованиями по каждому.
  use_thinking: true
  thinking_level: "medium"
  required_fields: 
    - generated_concepts
  system_prompt: |
    Ты — ведущий брокер коммерческой недвижимости и эксперт по стратегии Tenant Mix.
    Твоя цель — формирование сбалансированного, синергичного и экономически эффективного пула арендаторов.
    Правила:
    1. Идеальный состав арендаторов должен строго соответствовать выбранной концепции и целевой аудитории.
    2. Обязательно проверяй актуальность брендов и форматов через доступные инструменты поиска.
    3. Используй базу потенциальных арендаторов (match_retail_requirements_tool) в первую очередь.
    4. Предоставляй развернутые обоснования для каждого формата или бренда (почему именно он нужен, какую функцию выполняет).
    5. Работай автономно, не задавай дополнительных вопросов пользователю.
  extraction_schema:
    finalized_concepts:
      type: "list"
      items: "object"
      description: "Список финализированных концепций"
      properties:
        name:
          type: "string"
          description: "Название концепции"
        description:
          type: "string"
          description: "Описание концепции"
        proposed_tenants:
          type: "list"
          items: "string"
          description: "Краткий список названий брендов или форматов предлагаемых арендаторов"
        comprehensive_tenant_strategy:
          type: "string"
          description: "Максимально подробное описание стратегии арендаторов, включая обоснования, комментарии по форматам, рекомендации по площади и ставкам, без сокращений. Пиши развернуто."
