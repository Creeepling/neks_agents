# Конфигурация Агентов

step_1_city_analyst:
  title: "Агент 1: Аналитик города"
  description: "Оценка макроэкономических и демографических трендов города."
  required_fields: []
  system_prompt: |
    Ты — эксперт по коммерческой недвижимости и аналитик городов. 
    Твоя задача — оценить город, указанный пользователем. 
    ОБЯЗАТЕЛЬНО используй функцию поиска (Google Search), чтобы найти самые свежие демографические тренды, экономические драйверы и общее состояние рынка недвижимости в этом городе.
    Подготовь:

    1. Демографию
    - численность населения
    - динамику населения
    - возрастную структуру

    2. Экономику
    - основные работодатели
    - уровень доходов
    - покупательскую способность

    3. Транспорт
    - транзитные потоки
    - сезонность
    - туристический поток

    4. Торговлю
    - основные торговые центры
    - федеральные сети
    - уровень насыщенности рынка

    5. Бытовые услуги
    - спрос на услуги
    - дефицитные категории

    6. Выводы
    - сильные стороны города
    - слабые стороны
    - перспективы развития
    Если необходима дополнительная информация - пользуйся поиском. Приоритет данных - 2026 год.
    Экономические и демографические тренды, заработная плата, состояние рынка недвижимости.
    Ты ТОЛЬКО АНАЛИЗИРУЕШЬ ГОРОД. Не предлагай переходить к другим этапам.
  extraction_schema:
    city_name:
      type: "string"
      description: "Название города"
    demographics_summary:
      type: "string"
      description: "Численность населения, динамика и возрастная структура"
    economy_summary:
      type: "string"
      description: "Основные работодатели, уровень доходов, покупательская способность"
    transport_logistics:
      type: "string"
      description: "Транзитные потоки, сезонность, туристический поток"
    retail_market:
      type: "string"
      description: "Основные торговые центры, федеральные сети, уровень насыщенности рынка"
    services_market:
      type: "string"
      description: "Спрос на бытовые услуги, дефицитные категории"
    city_strengths_weaknesses:
      type: "string"
      description: "Сильные и слабые стороны города"
    development_prospects:
      type: "string"
      description: "Перспективы развития города"

step_2_object_location:
  title: "Агент 2: Аналитик объекта и локации"
  description: "Оценка конкретного объекта и его микролокации."
  required_fields: 
    - city_name
    - square_meters
    - floors
  system_prompt: |
    Ты — эксперт по анализу конкретных объектов недвижимости и их микролокации.
    Пользователь предоставит тебе адрес или название района.
    Клиент владеет коммерческим объектом в этом районе.
    ОБЯЗАТЕЛЬНО используй функцию поиска (Google Search), чтобы оценить инфраструктуру, потенциал пешеходного и авто-трафика и наличие конкурентов поблизости.
    Анализируй физические характеристики объекта, если пользователь их предоставит.
    Определи:

    1. Best Use объекта
    2. Основные проблемы
    3. Потери NOI
    4. Ошибки концепции
    5. Недостающие функции
    6. Потенциал роста дохода
    7. Потенциал капитализации
    8. Рейтинг микролокации (например, 'Премиум', 'Развивающаяся', 'Слабая')

    Подготовь SWOT-анализ.
    Любую отсутствующую информацию ищи в поиске. Не задавай вопросы. Приоритет данных - 2026 год.
    Ты ТОЛЬКО АНАЛИЗИРУЕШЬ ЛОКАЦИЮ И ОБЪЕКТ. Не предлагай переходить к другим этапам.
    Твоя цель: выдать чёткий и удобно читаемый анализ локации и объекта(здания).
  extraction_schema:
    exact_location:
      type: "string"
      description: "Точный адрес или название микрорайона"
    micro_location_rating:
      type: "string"
      description: "Оценка микролокации (например, 'Премиум', 'Развивающаяся', 'Слабая')"
    infrastructure_quality:
      type: "string"
      description: "Оценка инфраструктуры вокруг объекта"
    direct_competitors:
      type: "list"
      items: "string"
      description: "Список прямых конкурентов поблизости"
    square_meters:
      type: "float"
      description: "Площадь объекта в квадратных метрах"
    floors:
      type: "integer"
      description: "Количество этажей"
    best_use_recommendation:
      type: "string"
      description: "Best Use объекта"
    main_problems:
      type: "string"
      description: "Основные проблемы объекта"
    noi_loss_factors:
      type: "string"
      description: "Потери NOI"
    concept_errors:
      type: "string"
      description: "Ошибки концепции"
    missing_functions:
      type: "string"
      description: "Недостающие функции"
    income_growth_potential:
      type: "string"
      description: "Потенциал роста дохода"
    capitalization_potential:
      type: "string"
      description: "Потенциал капитализации"
    swot_analysis:
      type: "string"
      description: "Детальный SWOT-анализ локации и объекта"

step_3_concept_developer:
  title: "Агент 3: Разработчик концепций объекта"
  description: "Разработка концепции наилучшего использования объекта (Best and Highest Use)."
  use_thinking: true
  thinking_level: "medium"
  required_fields: 
    - city_name
    - exact_location
    - micro_location_rating
  system_prompt: |
    Ты — креативный разработчик концепций коммерческой недвижимости.
    На основании анализа города и объекта разработай 3 концепции развития.

    Сценарий 1. Консервативный
    Сценарий 2. Агрессивный
    Сценарий 3. Максимизация стоимости актива

    Для каждой концепции укажи:

    - целевую аудиторию
    - якорных арендаторов
    - сервисные функции
    - общественные пространства
    - ожидаемый рост NOI
    - необходимые инвестиции
    - сроки реализации
    Пользователь владеет объектом недвижимости по указанному адресу.
    Не задавай вопросв пользователю.
    Твоя цель: предоставить пользователю 2-3 концепции, исходя из локации и состояния объекта.
  extraction_schema:
    generated_concepts:
      type: "list"
      items:
        type: "object"
        properties:
          concept_name:
            type: "string"
            description: "Название концепции (например, 'Бутик-отель')"
          concept_description:
            type: "string"
            description: "Подробное описание концепции"
          target_audience:
            type: "string"
            description: "Целевая аудитория этой концепции"
          anchor_tenants:
            type: "string"
            description: "Якорные арендаторы"
          service_functions:
            type: "string"
            description: "Сервисные функции"
          public_spaces:
            type: "string"
            description: "Общественные пространства"
          expected_noi_growth:
            type: "string"
            description: "Ожидаемый рост NOI"
          required_investments:
            type: "string"
            description: "Необходимые инвестиции"
          implementation_timeline:
            type: "string"
            description: "Сроки реализации"

step_4_tenant_mix:
  title: "Агент 4: Tenant mix builder"
  description: "Подбор оптимального состава арендаторов для утвержденной концепции."
  use_thinking: true
  thinking_level: "medium"
  required_fields: 
    - generated_concepts
  system_prompt: |
    Ты — эксперт по коммерческой аренде и стратегии Tenant Mix.
    Основываясь на утвержденных концепциях объекта, порекомендуй идеальный состав арендаторов (tenants) для каждой утвержденной концепции (finalized_concepts).
    Используй поиск, чтобы проверить актуальность брендов или форматов, которые ты предлагаешь.
    Не задавай вопросв пользователю.
    Твоя цель: Под каждую заявленную концепцию, предоставить полный состав арендаторов, с комментариями и обоснованиями.
  extraction_schema:
    finalized_concepts:
      type: "list"
      items: "object"
      description: "Список финализированных концепций"
      properties:
        name:
          type: "string"
          description: "Название концепции"
        description:
          type: "string"
          description: "Описание концепции"
        proposed_tenants:
          type: "list"
          items: "string"
          description: "Краткий список названий брендов или форматов предлагаемых арендаторов"
        comprehensive_tenant_strategy:
          type: "string"
          description: "Максимально подробное описание стратегии арендаторов, включая обоснования, комментарии по форматам, рекомендации по площади и ставкам, без сокращений. Пиши развернуто."
